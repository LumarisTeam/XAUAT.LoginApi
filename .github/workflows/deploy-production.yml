name: Build image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      aot:
        description: 使用 Native AOT 构建（选 false 则走 JIT 自包含发布）
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  REGISTRY: ghcr.io
  # 国内镜像仓库：这两个 Variable 都配了才会双推，没配就只推 ghcr。
  # 配在 仓库/组织 → Settings → Secrets and variables → Actions → Variables。
  # 本项目用腾讯云 TCR 个人版，所以 MIRROR_REGISTRY=ccr.ccs.tencentyun.com；
  # MIRROR_NAMESPACE 填 TCR 控制台里建的命名空间，仓库名沿用 $GITHUB_REPOSITORY 的末段。
  # 配套的 MIRROR_USERNAME / MIRROR_PASSWORD 两个 Secret：用户名是腾讯云账号 ID，
  # 密码是 TCR 实例管理里「初始化密码」设的固定密码。
  MIRROR_REGISTRY: ${{ vars.MIRROR_REGISTRY }}
  MIRROR_NAMESPACE: ${{ vars.MIRROR_NAMESPACE }}
  AOT_ENABLED: ${{ inputs.aot || 'true' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore XAUAT.LoginApi.slnx
      - name: Build
        run: dotnet build XAUAT.LoginApi.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test XAUAT.LoginApi.slnx --no-build --configuration Release --verbosity normal

  # 防止 AOT 能力腐化：本项目从 Flask 迁移时，解析逻辑最容易诱导人引入
  # HtmlAgilityPack / Newtonsoft / Ical.Net，而它们都会让 Native AOT 失效
  # （整套解析因此刻意只用 [GeneratedRegex]，ICS 也是手写的）。
  # linux-x64 的原生二进制无法在 macOS 上交叉编译，因此本机开发时验证不了，
  # 这一步是唯一的把关点。
  #
  # 手动选了 JIT 变体时整步跳过：这个开关的用武之地，往往正是 AOT 发布已经跑不通
  # （新依赖不支持 AOT、链接失败等）而需要临时改用 JIT 顶上——门要是还拦着，
  # 它就从"逃生口"变成了"锁死"。腐化仍会在下一次 push/PR 时被拦下。
  aot-check:
    name: AOT publish gate
    needs: test
    if: ${{ inputs.aot != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Publish with Native AOT
        run: |
          dotnet publish XAUAT.LoginApi.Web/XAUAT.LoginApi.Web.csproj \
            --configuration Release \
            --runtime linux-x64 \
            -p:PublishAot=true \
            --output ./aot-out 2>&1 | tee aot.log
      # csproj 里已把 IL2026/IL3050 设为错误，正常情况下上一步就会失败。
      # 这里再查一遍是为了在有人改动 csproj 后仍然拦得住，并给出更明确的报错。
      - name: Assert no AOT analyzer warnings from our own code
        run: |
          if grep -qE "warning IL2026|warning IL3050" aot.log; then
            echo "::error::检测到 IL2026/IL3050：有代码走到了 Native AOT 不支持的路径"
            grep -E "warning IL2026|warning IL3050" aot.log
            exit 1
          fi

  publish:
    name: Build image
    needs: [test, aot-check]
    # 有 job 被跳过时，dependent 默认跟着被跳过，所以必须显式写出 always() 加各 needs 的结果判定。
    if: |
      always() && !cancelled()
      && github.event_name != 'pull_request'
      && needs.test.result == 'success'
      && (needs.aot-check.result == 'success' || needs.aot-check.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name, tag and cache scope
        id: image
        shell: bash
        run: |
          repository="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repository}"
          name="${repository##*/}"
          if [[ "$AOT_ENABLED" == "true" ]]; then
            suffix=""
            extra_tag="latest"
            cache_scope="aot"
          else
            # 备用变体：tag 加 -jit 后缀，另外推进一个移动 tag :jit 供 deploy/build_from_ghcr.sh 直接用。
            # 刻意不动 :latest —— 默认镜像必须始终是 AOT 那一个，否则一次手动 JIT 部署之后，
            # 任何人跑 ./deploy/build_from_ghcr.sh（默认取 :latest）都会静默拿到 JIT 镜像。
            suffix="-jit"
            extra_tag="jit"
            cache_scope="jit"
          fi
          tag="${GITHUB_SHA}${suffix}"

          # tag 列表：ghcr 永远推；配了国内镜像仓库时，再把同一批 tag 推一份过去，
          # 好让国内服务器从那边拉，绕开 ghcr 的跨国链路。
          {
            echo "tags<<TAGS_EOF"
            echo "${image}:${tag}"
            echo "${image}:${extra_tag}"
            if [[ -n "$MIRROR_REGISTRY" && -n "$MIRROR_NAMESPACE" ]]; then
              echo "${MIRROR_REGISTRY}/${MIRROR_NAMESPACE}/${name}:${tag}"
              echo "${MIRROR_REGISTRY}/${MIRROR_NAMESPACE}/${name}:${extra_tag}"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "extra_tag=${extra_tag}" >> "$GITHUB_OUTPUT"
          echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 国内镜像仓库：上面两个 Variable 都配了才会登录并多推一份。
      - name: Sign in to mirror registry
        if: env.MIRROR_REGISTRY != '' && env.MIRROR_NAMESPACE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.MIRROR_REGISTRY }}
          username: ${{ secrets.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            AOT_ENABLED=${{ env.AOT_ENABLED }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=${{ steps.image.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.cache_scope }}
